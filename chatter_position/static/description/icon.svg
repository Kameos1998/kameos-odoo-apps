<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#9B1916" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9B1916" stop-opacity="0"/>
    </radialGradient>
    <filter id="paneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1.5" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded dark background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect width="128" height="128" rx="24" fill="url(#glow)"/>

  <!-- Form pane (left) -->
  <g filter="url(#paneShadow)">
    <rect x="20" y="28" width="38" height="72" rx="6" fill="#ffffff"/>
    <!-- form header bar -->
    <rect x="20" y="28" width="38" height="10" rx="6" fill="#f1f3f7"/>
    <rect x="20" y="34" width="38" height="4" fill="#f1f3f7"/>
    <!-- field rows -->
    <rect x="25" y="46" width="28" height="3.5" rx="1.5" fill="#e2e5ec"/>
    <rect x="25" y="54" width="22" height="3.5" rx="1.5" fill="#e2e5ec"/>
    <rect x="25" y="62" width="28" height="3.5" rx="1.5" fill="#e2e5ec"/>
    <rect x="25" y="70" width="20" height="3.5" rx="1.5" fill="#e2e5ec"/>
    <rect x="25" y="78" width="26" height="3.5" rx="1.5" fill="#e2e5ec"/>
    <rect x="25" y="86" width="18" height="3.5" rx="1.5" fill="#e2e5ec"/>
  </g>

  <!-- Splitter (signature red bar) -->
  <g>
    <rect x="61" y="36" width="6" height="56" rx="3" fill="#9B1916"/>
    <!-- grip dots -->
    <circle cx="64" cy="60" r="0.9" fill="white"/>
    <circle cx="64" cy="64" r="0.9" fill="white"/>
    <circle cx="64" cy="68" r="0.9" fill="white"/>
  </g>

  <!-- Chatter pane (right) -->
  <g filter="url(#paneShadow)">
    <rect x="70" y="28" width="38" height="72" rx="6" fill="#ffffff"/>
    <!-- chatter topbar -->
    <rect x="70" y="28" width="38" height="10" rx="6" fill="#f1f3f7"/>
    <rect x="70" y="34" width="38" height="4" fill="#f1f3f7"/>
    <!-- highlighted toggle button (red — the module's signature) -->
    <rect x="98" y="30" width="7" height="6" rx="1" fill="#9B1916"/>
    <!-- avatar circle + message lines -->
    <circle cx="78" cy="50" r="4" fill="#9B1916"/>
    <rect x="84" y="47" width="20" height="2.5" rx="1" fill="#e2e5ec"/>
    <rect x="84" y="51" width="15" height="2.5" rx="1" fill="#e2e5ec"/>
    <circle cx="78" cy="64" r="4" fill="#636980"/>
    <rect x="84" y="61" width="22" height="2.5" rx="1" fill="#e2e5ec"/>
    <rect x="84" y="65" width="18" height="2.5" rx="1" fill="#e2e5ec"/>
    <circle cx="78" cy="78" r="4" fill="#636980"/>
    <rect x="84" y="75" width="20" height="2.5" rx="1" fill="#e2e5ec"/>
    <rect x="84" y="79" width="14" height="2.5" rx="1" fill="#e2e5ec"/>
    <!-- send composer -->
    <rect x="74" y="89" width="30" height="6" rx="2" fill="#f8f9fc" stroke="#e2e5ec" stroke-width="0.6"/>
  </g>

  <!-- Tiny toggle arrows indicator (top-right corner, signals "switchable layout") -->
  <g transform="translate(96, 8)">
    <circle cx="12" cy="12" r="11" fill="#9B1916"/>
    <!-- horizontal/vertical toggle arrows (≡ vs ▤) -->
    <path d="M 8 9 L 16 9 M 8 12 L 16 12 M 8 15 L 16 15"
          stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  </g>

</svg>
