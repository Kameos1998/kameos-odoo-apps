<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>

    <linearGradient id="redToOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1916"/>
      <stop offset="100%" stop-color="#f0c4c3"/>
    </linearGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B1916" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9B1916" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.4"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background with subtle red glows -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>
  <circle cx="1100" cy="120" r="240" fill="url(#redGlow)"/>
  <circle cx="200" cy="600" r="180" fill="url(#redGlow)" opacity="0.5"/>

  <!-- Top-left: Kameos logo on a white rounded card -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="280" height="80" rx="14" fill="white"/>
    <image x="20" y="14" width="240" height="52" preserveAspectRatio="xMidYMid meet"
           xlink:href="logo-kameos.webp" href="logo-kameos.webp"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="225" font-size="16" font-weight="700" fill="#9B1916" letter-spacing="3">
    ODOO 19 MODULE
  </text>

  <!-- Title -->
  <text x="80" y="310" font-size="80" font-weight="800" fill="white" letter-spacing="-2">
    Chatter
  </text>
  <text x="80" y="395" font-size="80" font-weight="800" fill="url(#redToOrange)" letter-spacing="-2">
    Position
  </text>

  <!-- Tagline -->
  <text x="80" y="455" font-size="24" font-weight="400" fill="#cbd5e1">
    Toggle between side and bottom layouts.
  </text>
  <text x="80" y="488" font-size="24" font-weight="400" fill="#cbd5e1">
    Drag the splitter to fine-tune the ratio.
  </text>

  <!-- Feature pills -->
  <g transform="translate(80, 545)" font-size="14" font-weight="600" fill="white">
    <g>
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#9B1916"/>
      <text x="80" y="27" text-anchor="middle">Side or Bottom</text>
    </g>
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(155, 25, 22, 0.25)" stroke="#9B1916" stroke-width="1.5"/>
      <text x="90" y="27" text-anchor="middle">Draggable splitter</text>
    </g>
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="rgba(155, 25, 22, 0.25)" stroke="#9B1916" stroke-width="1.5"/>
      <text x="85" y="27" text-anchor="middle">No DB changes</text>
    </g>
  </g>

  <!-- Bottom credit line -->
  <text x="80" y="660" font-size="13" font-weight="400" fill="#94a3b8">
    Compatible Odoo 19  ·  LGPL-3  ·  by
  </text>
  <text x="290" y="660" font-size="13" font-weight="700" fill="#9B1916">
    Kameos
  </text>
  <text x="355" y="660" font-size="13" font-weight="400" fill="#94a3b8">
    Odoo integrator, Belgium
  </text>

  <!-- ============ Mockup: form (left) + splitter + chatter (right) ============ -->
  <g transform="translate(700, 110)" filter="url(#cardShadow)">

    <!-- Form card (left) -->
    <rect x="0" y="0" width="220" height="500" rx="14" fill="#ffffff"/>

    <!-- Form header bar -->
    <rect x="0" y="0" width="220" height="44" rx="14" fill="#f8f9fc"/>
    <rect x="0" y="30" width="220" height="14" fill="#f8f9fc"/>
    <!-- Breadcrumb -->
    <text x="16" y="28" font-size="11" font-weight="600" fill="#636980">Customers</text>
    <text x="78" y="28" font-size="11" fill="#9ca3af">›</text>
    <text x="88" y="28" font-size="11" font-weight="700" fill="#1e2235">Acme Corp</text>
    <!-- Save indicator dot -->
    <circle cx="200" cy="22" r="4" fill="#9B1916"/>

    <!-- Title -->
    <text x="16" y="78" font-size="18" font-weight="800" fill="#1e2235">Acme Corp</text>
    <text x="16" y="98" font-size="11" fill="#636980">acme@example.com</text>

    <!-- Field rows -->
    <g font-size="10" fill="#636980">
      <text x="16" y="138">Phone</text>
      <rect x="16" y="146" width="188" height="22" rx="4" fill="#f1f3f7"/>
      <text x="22" y="161" font-size="10" fill="#1e2235">+32 2 555 01 23</text>

      <text x="16" y="190">Address</text>
      <rect x="16" y="198" width="188" height="22" rx="4" fill="#f1f3f7"/>
      <text x="22" y="213" font-size="10" fill="#1e2235">Rue de la Loi 16, Brussels</text>

      <text x="16" y="242">Salesperson</text>
      <rect x="16" y="250" width="188" height="22" rx="4" fill="#f1f3f7"/>
      <text x="22" y="265" font-size="10" fill="#1e2235">Marc Demo</text>

      <text x="16" y="294">Tags</text>
      <g transform="translate(16, 302)">
        <rect x="0" y="0" width="50" height="18" rx="9" fill="#fef2f2" stroke="#9B1916" stroke-width="1"/>
        <text x="25" y="12" text-anchor="middle" font-size="9" fill="#9B1916">B2B</text>
        <rect x="56" y="0" width="60" height="18" rx="9" fill="#fef2f2" stroke="#9B1916" stroke-width="1"/>
        <text x="86" y="12" text-anchor="middle" font-size="9" fill="#9B1916">Premium</text>
      </g>

      <text x="16" y="350">Website</text>
      <rect x="16" y="358" width="188" height="22" rx="4" fill="#f1f3f7"/>
      <text x="22" y="373" font-size="10" fill="#1e2235">https://acme.example</text>

      <text x="16" y="402">Currency</text>
      <rect x="16" y="410" width="188" height="22" rx="4" fill="#f1f3f7"/>
      <text x="22" y="425" font-size="10" fill="#1e2235">EUR (€)</text>
    </g>

    <!-- Bottom tabs -->
    <line x1="16" y1="450" x2="204" y2="450" stroke="#e2e5ec" stroke-width="1"/>
    <text x="16" y="470" font-size="10" font-weight="700" fill="#9B1916">Sales</text>
    <line x1="16" y1="476" x2="40" y2="476" stroke="#9B1916" stroke-width="2"/>
    <text x="56" y="470" font-size="10" fill="#636980">Invoicing</text>
    <text x="116" y="470" font-size="10" fill="#636980">Notes</text>

    <!-- Splitter (highlighted in red — the module's signature feature) -->
    <g transform="translate(228, 60)">
      <rect x="0" y="0" width="6" height="380" rx="3" fill="#9B1916"/>
      <!-- grip dots -->
      <circle cx="3" cy="180" r="1.4" fill="white"/>
      <circle cx="3" cy="190" r="1.4" fill="white"/>
      <circle cx="3" cy="200" r="1.4" fill="white"/>
    </g>

    <!-- Chatter card (right) -->
    <g transform="translate(244, 0)">
      <rect x="0" y="0" width="316" height="500" rx="14" fill="#ffffff"/>

      <!-- Chatter topbar -->
      <rect x="0" y="0" width="316" height="44" rx="14" fill="#f8f9fc"/>
      <rect x="0" y="30" width="316" height="14" fill="#f8f9fc"/>

      <!-- Send Message (active) -->
      <rect x="10" y="10" width="78" height="24" rx="4" fill="#ffffff" stroke="#e2e5ec" stroke-width="1"/>
      <text x="49" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#1e2235">Send message</text>

      <!-- Log Note -->
      <text x="100" y="26" font-size="10" font-weight="600" fill="#636980">Log note</text>

      <!-- Activities -->
      <text x="148" y="26" font-size="10" font-weight="600" fill="#636980">Activities</text>

      <!-- Toggle button (THE feature — highlighted) -->
      <g transform="translate(244, 12)">
        <rect x="0" y="0" width="22" height="22" rx="4" fill="#9B1916"/>
        <!-- columns icon (two vertical bars) -->
        <rect x="6" y="6" width="3.5" height="10" rx="0.5" fill="white"/>
        <rect x="12.5" y="6" width="3.5" height="10" rx="0.5" fill="white"/>
      </g>
      <!-- Search icon -->
      <g transform="translate(274, 12)" stroke="#636980" stroke-width="1.5" fill="none">
        <circle cx="9" cy="9" r="5"/>
        <line x1="13" y1="13" x2="17" y2="17" stroke-linecap="round"/>
      </g>

      <!-- Followers badge -->
      <g transform="translate(10, 60)">
        <rect x="0" y="0" width="70" height="20" rx="10" fill="#f1f3f7"/>
        <text x="35" y="13" text-anchor="middle" font-size="9" font-weight="600" fill="#636980">3 followers</text>
      </g>

      <!-- Compose box -->
      <g transform="translate(10, 92)">
        <rect x="0" y="0" width="296" height="56" rx="6" fill="#f8f9fc" stroke="#e2e5ec" stroke-width="1"/>
        <text x="10" y="22" font-size="10" fill="#9ca3af">Type a message…</text>
        <rect x="240" y="32" width="48" height="18" rx="4" fill="#9B1916"/>
        <text x="264" y="44" text-anchor="middle" font-size="9" font-weight="700" fill="white">Send</text>
      </g>

      <!-- Message thread -->
      <g transform="translate(10, 168)">
        <!-- Message 1 -->
        <circle cx="14" cy="14" r="14" fill="#9B1916"/>
        <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="white">M</text>
        <text x="36" y="14" font-size="10" font-weight="700" fill="#1e2235">Marc Demo</text>
        <text x="100" y="14" font-size="9" fill="#9ca3af">2 min ago</text>
        <rect x="36" y="20" width="220" height="6" rx="3" fill="#e2e5ec"/>
        <rect x="36" y="30" width="170" height="6" rx="3" fill="#e2e5ec"/>
      </g>

      <g transform="translate(10, 220)">
        <!-- Message 2 -->
        <circle cx="14" cy="14" r="14" fill="#636980"/>
        <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="white">A</text>
        <text x="36" y="14" font-size="10" font-weight="700" fill="#1e2235">Admin</text>
        <text x="74" y="14" font-size="9" fill="#9ca3af">15 min ago</text>
        <rect x="36" y="20" width="240" height="6" rx="3" fill="#e2e5ec"/>
        <rect x="36" y="30" width="200" height="6" rx="3" fill="#e2e5ec"/>
        <rect x="36" y="40" width="120" height="6" rx="3" fill="#e2e5ec"/>
      </g>

      <!-- System log entry -->
      <g transform="translate(10, 292)">
        <circle cx="14" cy="14" r="14" fill="#f1f3f7" stroke="#e2e5ec" stroke-width="1"/>
        <text x="14" y="19" text-anchor="middle" font-size="13" fill="#636980">⚙</text>
        <text x="36" y="14" font-size="10" font-weight="700" fill="#1e2235">Stage changed</text>
        <text x="36" y="28" font-size="9" fill="#636980">New → Qualified</text>
      </g>

      <!-- Tip box -->
      <g transform="translate(10, 348)">
        <rect x="0" y="0" width="296" height="58" rx="8" fill="#fef2f2" stroke="#9B1916" stroke-width="1"/>
        <text x="12" y="20" font-size="10" font-weight="700" fill="#9B1916">Drag the splitter ←→</text>
        <text x="12" y="36" font-size="9" fill="#1e2235">Resize the form/chatter ratio in real time.</text>
        <text x="12" y="50" font-size="9" fill="#1e2235">Double-click to reset to 60/40.</text>
      </g>

      <!-- Footer hint -->
      <text x="158" y="446" text-anchor="middle" font-size="9" fill="#9ca3af">Click ▦ to flip to bottom layout</text>
    </g>

  </g>

</svg>
